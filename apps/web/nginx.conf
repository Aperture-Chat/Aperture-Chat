server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # The API enforces the per-file ceiling. Keep the proxy high enough for a
  # multi-file knowledge upload instead of rejecting the combined request.
  client_max_body_size 2g;
  proxy_connect_timeout 60s;
  proxy_send_timeout 75m;
  proxy_read_timeout 75m;

  # Compress text responses: the session-resume/bootstrap JSON and the JS
  # bundles shrink several-fold. text/event-stream is deliberately absent so
  # chat streaming stays unbuffered.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json application/javascript text/css image/svg+xml text/plain;

  location / {
    try_files $uri /index.html;
    # The SPA shell must revalidate on every load so deploys are picked up
    # immediately; without this, browsers heuristically cache index.html and
    # keep serving the previous build's hashed asset references.
    add_header Cache-Control "no-cache";
  }

  # Hashed build assets are content-addressed and safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/ {
    proxy_pass http://api:8000/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /scim/v2/ {
    proxy_pass http://api:8000/scim/v2/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://api:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

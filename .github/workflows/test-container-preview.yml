name: Branch Container Images

on:
  push:
    branches:
      - dev
      - test
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: branch-container-images-${{ github.ref }}
  # Do not automatically interrupt a run between the two branch alias updates.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    name: Publish branch images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare image metadata
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            dev|test|main) ;;
            *) echo "Branch images are only published for dev, test, and main." >&2; exit 1 ;;
          esac
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "API_IMAGE=ghcr.io/${owner_lc}/aperture-chat-api"
            echo "WEB_IMAGE=ghcr.io/${owner_lc}/aperture-chat-web"
            echo "BRANCH_TAG=${GITHUB_REF_NAME}"
            echo "IMMUTABLE_TAG=${GITHUB_REF_NAME}-${GITHUB_SHA}"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API SHA image
        id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.API_IMAGE }}:${{ env.IMMUTABLE_TAG }}

      - name: Build and publish web SHA image
        id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VITE_API_BASE_URL=
          tags: ${{ env.WEB_IMAGE }}:${{ env.IMMUTABLE_TAG }}

      - name: Verify SHA image pair and promote branch aliases
        shell: bash
        env:
          API_EXPECTED_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_EXPECTED_DIGEST: ${{ steps.web.outputs.digest }}
        run: bash scripts/promote-branch-images.sh

      - name: Record inspection references
        shell: bash
        run: |
          {
            echo "## Branch container images"
            echo
            echo "Built from commit \`${GITHUB_SHA}\`:"
            echo
            echo "- \`${API_IMAGE}:${IMMUTABLE_TAG}\`"
            echo "- \`${API_IMAGE}:${BRANCH_TAG}\`"
            echo "- \`${WEB_IMAGE}:${IMMUTABLE_TAG}\`"
            echo "- \`${WEB_IMAGE}:${BRANCH_TAG}\`"
            echo
            if [[ "${GITHUB_REF_NAME}" == "test" ]]; then
              echo "Promotions to \`main\` must use the immutable \`test-${GITHUB_SHA}\` image pair."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: Test Container Preview

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: test-container-preview-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish-preview:
    name: Publish immutable test images
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare image metadata
        shell: bash
        run: |
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "API_IMAGE=ghcr.io/${owner_lc}/aperture-chat-api"
            echo "WEB_IMAGE=ghcr.io/${owner_lc}/aperture-chat-web"
            echo "PREVIEW_TAG=test-${GITHUB_SHA}"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API preview
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.API_IMAGE }}:${{ env.PREVIEW_TAG }}

      - name: Build and publish web preview
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VITE_API_BASE_URL=
          tags: ${{ env.WEB_IMAGE }}:${{ env.PREVIEW_TAG }}

      - name: Record inspection references
        shell: bash
        run: |
          {
            echo "## Test container preview"
            echo
            echo "Built from commit \`${GITHUB_SHA}\`:"
            echo
            echo "- \`${API_IMAGE}:${PREVIEW_TAG}\`"
            echo "- \`${WEB_IMAGE}:${PREVIEW_TAG}\`"
            echo
            echo "Promotions to \`main\` must use this exact commit and image pair."
          } >> "$GITHUB_STEP_SUMMARY"

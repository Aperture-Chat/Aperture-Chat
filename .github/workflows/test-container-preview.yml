name: Branch Container Images

on:
  push:
    branches:
      - dev
      - test
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: branch-container-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    name: Publish branch images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare image metadata
        shell: bash
        run: |
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "API_IMAGE=ghcr.io/${owner_lc}/aperture-chat-api"
            echo "WEB_IMAGE=ghcr.io/${owner_lc}/aperture-chat-web"
            echo "BRANCH_TAG=${GITHUB_REF_NAME}"
            echo "IMMUTABLE_TAG=${GITHUB_REF_NAME}-${GITHUB_SHA}"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.IMMUTABLE_TAG }}
            ${{ env.API_IMAGE }}:${{ env.BRANCH_TAG }}

      - name: Build and publish web images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VITE_API_BASE_URL=
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.IMMUTABLE_TAG }}
            ${{ env.WEB_IMAGE }}:${{ env.BRANCH_TAG }}

      - name: Verify published image manifests
        shell: bash
        run: |
          set -euo pipefail

          inspect_image_pair() {
            local image="$1"
            local immutable_output branch_output immutable_digest branch_digest

            immutable_output="$(docker buildx imagetools inspect "${image}:${IMMUTABLE_TAG}")"
            branch_output="$(docker buildx imagetools inspect "${image}:${BRANCH_TAG}")"

            printf '%s\n' "${immutable_output}"
            printf '%s\n' "${branch_output}"

            for output in "${immutable_output}" "${branch_output}"; do
              grep -Eq 'Platform:[[:space:]]+linux/amd64' <<< "${output}"
              grep -Eq 'Platform:[[:space:]]+linux/arm64' <<< "${output}"
            done

            immutable_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "${immutable_output}")"
            branch_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "${branch_output}")"
            if [[ -z "${immutable_digest}" || "${immutable_digest}" != "${branch_digest}" ]]; then
              echo "Branch and immutable image digests differ for ${image}." >&2
              exit 1
            fi
          }

          inspect_image_pair "${API_IMAGE}"
          inspect_image_pair "${WEB_IMAGE}"

      - name: Record inspection references
        shell: bash
        run: |
          {
            echo "## Branch container images"
            echo
            echo "Built from commit \`${GITHUB_SHA}\`:"
            echo
            echo "- \`${API_IMAGE}:${IMMUTABLE_TAG}\`"
            echo "- \`${API_IMAGE}:${BRANCH_TAG}\`"
            echo "- \`${WEB_IMAGE}:${IMMUTABLE_TAG}\`"
            echo "- \`${WEB_IMAGE}:${BRANCH_TAG}\`"
            echo
            if [[ "${GITHUB_REF_NAME}" == "test" ]]; then
              echo "Promotions to \`main\` must use the immutable \`test-${GITHUB_SHA}\` image pair."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

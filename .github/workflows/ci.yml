name: CI

on:
  pull_request:
    branches:
      - dev
      - test
      - main
  push:
    branches:
      - main
      - dev
      - test

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Node.js baseline
        run: npm run check:node-baseline

      - name: Test branch image promotion recovery
        run: node --test scripts/promote-branch-images.test.mjs

      - name: Test release installer and updater recovery
        run: |
          python3 scripts/test_install_release.py
          python3 scripts/test_updater.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm --workspace apps/web run typecheck

      - name: Test training generators
        run: |
          node --test apps/web/scripts/*.test.cjs
          python3 apps/web/scripts/test_training_narration.py

      - name: Test
        run: npm run test:web -- --run

      - name: Build
        run: npm run build:web

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest

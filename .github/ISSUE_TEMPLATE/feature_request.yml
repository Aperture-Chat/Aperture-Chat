name: Feature request
description: Propose one focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please search existing issues first. For larger changes, agreeing on the approach here before writing code saves rework.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to happen? A small first step is easier to agree on than a full redesign.
    validations:
      required: true
  - type: textarea
    id: roles
    attributes:
      label: Roles and workflows affected
      description: Identify user, tenant-admin, platform-owner, API, or deployment impact.
  - type: textarea
    id: proof
    attributes:
      label: Mockups or examples
      description: Optional screenshots or clips must use synthetic data.
  - type: textarea
    id: risks
    attributes:
      label: Risks and alternatives
      description: Note security, privacy, migration, compatibility, and simpler alternatives.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes, I'd like to open a pull request"
        - Maybe, with some guidance
        - "No"

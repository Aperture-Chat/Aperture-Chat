name: Bug report
description: Report a reproducible Aperture Chat defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, personal data, customer content, or vulnerability details. Use private vulnerability reporting for security issues.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start with...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or full commit SHA
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Affected role
      options:
        - User
        - Tenant admin
        - Platform owner
        - Deployment operator
        - Not role-specific
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add logs, screenshots, or clips only after removing private information.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and deployment shape. Do not include a private host or IP address.

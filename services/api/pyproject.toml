[project]
name = "aperture-api"
version = "0.5.0"
description = "Aperture Chat FastAPI service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0,<2.0.0",
  "fastapi>=0.116.1",
  "fastembed>=0.8.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "python-multipart>=0.0.20",
  "httpx>=0.28.1",
  "Pillow>=12.0.0",
  "defusedxml>=0.7.1,<1.0.0",
  "openpyxl>=3.1.5,<4.0.0",
  "python-dotenv>=1.0.1",
  "pyjwt>=2.9.0",
  "pyotp>=2.10.0,<3.0.0",
  "cryptography>=43.0.0",
  "croniter>=2.0.0",
  "pypdf>=5.9.0",
  "pypdfium2>=5.11.0",
  "pytesseract>=0.3.13",
  "python-pptx>=1.0.2",
  "python-oxmsg==0.0.2",
  "psycopg[binary]>=3.2.3,<4.0.0",
  "sqlalchemy>=2.0.36,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "ruff==0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
